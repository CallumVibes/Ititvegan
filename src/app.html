<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="description" content="Scan a barcode, find out if it's vegan. Free to read." />
		<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fbf9f7" media="(prefers-color-scheme: light)" />

		<!-- iOS home-screen install: the exemption from 7-day storage eviction -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="IsItVegan" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />

		<!-- Link-sharing is the growth loop, so unfurls matter: someone
		     texting "is this vegan?" is how most people arrive. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="IsItVegan" />
		<meta property="og:title" content="IsItVegan" />
		<meta
			property="og:description"
			content="Scan a barcode, find out if it's vegan. Crowd-sourced and free to read."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />

		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon.png" />

		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				const t = localStorage.getItem('isitvegan.theme');
				if (t === 'light' || t === 'dark')
					document.documentElement.dataset.theme = t;
			} catch {}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
